<!DOCTYPE html>
<html>
     <style>
    body{
        text-align: center;
    }
</style>
<head>
    <title>My Team</title>
</head>
<body>
<h1>My Pokémon Team</h1>
{% for pokemon in team %}

{% endfor %}
</body></html>
